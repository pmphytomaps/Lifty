name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Tests and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Wire release signing
        run: node scripts/configure-android-signing.mjs

      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/lifty-release.keystore

      - name: Refuse unsigned release builds
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::ANDROID_KEYSTORE_* secrets are not set. A debug-signed APK would never install over the real app, so this build stops here. Add the four secrets from KEYSTORE-README.txt (repo Settings -> Secrets and variables -> Actions) and re-run."
          exit 1

      - name: Build release APK
        env:
          LIFTY_UPLOAD_STORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'lifty-release.keystore' || '' }}
          LIFTY_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIFTY_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIFTY_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk lifty.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lifty-apk
          path: lifty.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: lifty.apk
