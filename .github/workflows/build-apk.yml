name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Check signing secrets
        id: signing
        run: echo "ok=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      # A debug-signed APK can never install over the properly signed app, so a
      # tagged release without signing secrets stops here instead of shipping a trap.
      - name: Refuse unsigned release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.ok != 'true' }}
        run: |
          echo "::error::ANDROID_KEYSTORE_* secrets are not set. Add the four secrets from KEYSTORE-README.txt (Settings -> Secrets and variables -> Actions) and re-run."
          exit 1

      - uses: actions/setup-java@v4
        if: ${{ steps.signing.outputs.ok == 'true' }}
        with:
          distribution: temurin
          java-version: 21

      - name: Generate native project
        if: ${{ steps.signing.outputs.ok == 'true' }}
        run: npx expo prebuild --platform android --no-install

      - name: Wire release signing
        if: ${{ steps.signing.outputs.ok == 'true' }}
        run: node scripts/configure-android-signing.mjs

      - name: Decode keystore
        if: ${{ steps.signing.outputs.ok == 'true' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/lifty-release.keystore

      - name: Build release APK
        if: ${{ steps.signing.outputs.ok == 'true' }}
        env:
          LIFTY_UPLOAD_STORE_FILE: lifty-release.keystore
          LIFTY_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIFTY_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIFTY_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        if: ${{ steps.signing.outputs.ok == 'true' }}
        run: cp android/app/build/outputs/apk/release/app-release.apk lifty.apk

      - uses: actions/upload-artifact@v4
        if: ${{ steps.signing.outputs.ok == 'true' }}
        with:
          name: lifty-apk
          path: lifty.apk

      - name: Attach to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.ok == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: lifty.apk
